<!DOCTYPE html>

</head>
<body class="bg-slate-50 min-h-screen antialiased">
    <div id="app" class="min-h-screen"></div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>
    <div id="modal-root" class="fixed inset-0 z-50"></div>
<script>
const CONFIG = {
  SUPABASE_URL: 'https://hqmskhywllcyievplmsm.supabase.co',
  SUPABASE_ANON_KEY: 'sbp_405b71eaa69cd2a69f13d539c6f5c4ec4d8cf4ab2c8c',
};
const SupabaseManager = {
  client: null,
  async init() {
    this.client = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    const { error } = await this.client.from('patients').select('count').limit(1).head();
    if (error && !error.message.includes('does not exist') && !error.message.includes('relation')) {
      throw new Error('Cannot connect to database');
    }
    return true;
  },
  async signIn(email, password) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    return error ? { user:null, error } : { user:data.user, error:null };
  },
  async signUp(email, password, name) {
    const { data, error } = await this.client.auth.signUp({ email, password, options:{ data:{ name } } });
    return error ? { user:null, error } : { user:data.user, error:null };
  },
  async signOut() { await this.client.auth.signOut(); },
  async getSession() {
    const { data } = await this.client.auth.getSession();
    return data.session;
  },
  async fetch(table) {
    const { data, error } = await this.client.from(table).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    return data;
  },
  async insert(table, record) {
    const { data, error } = await this.client.from(table).insert(record).select();
    if (error) throw error;
    return data[0];
  },
  async update(table, id, updates) {
    const { data, error } = await this.client.from(table).update(updates).eq('id', id).select();
    if (error) throw error;
    return data[0];
  },
  async delete(table, id) {
    const { error } = await this.client.from(table).delete().eq('id', id);
    if (error) throw error;
    return true;
  }
};
const App = {
  state: { user:null, route:'/dashboard', loading:true, patients:[], documents:[], expenses:[], sidebarOpen:false, searchQuery:'' },
  async init() {
    try {
      await SupabaseManager.init();
    } catch(e) {
      this.state.loading = false;
      this.state.connectionError = e.message;
      this.render();
      return;
    }
    const session = await SupabaseManager.getSession();
    if (session) {
      const { data } = await SupabaseManager.client.auth.getUser();
      this.state.user = data.user;
    }
    window.addEventListener('hashchange', () => this.handleRouting());
    this.handleRouting();
    if (this.state.user) await this.loadAllData();
    this.state.loading = false;
    this.render();
  },
  async loadAllData() {
    try {
      this.state.patients = await SupabaseManager.fetch('patients');
      this.state.expenses = await SupabaseManager.fetch('expenses');
      this.state.documents = await SupabaseManager.fetch('patient_documents');
    } catch(e) {
      this.toast('Failed to load data: ' + e.message, 'error');
    }
  },
  handleRouting() {
    this.state.route = window.location.hash.slice(1) || '/dashboard';
    if (!this.state.user && this.state.route !== '/login') { window.location.hash = '/login'; return; }
    if (this.state.user && this.state.route === '/login') { window.location.hash = '/dashboard'; return; }
    this.render();
  },
  render() {
    const app = document.getElementById('app');
    if (this.state.loading) { app.innerHTML = this.viewLoading(); return; }
    if (this.state.connectionError) { app.innerHTML = this.viewConnectionError(); return; }
    if (!this.state.user) { app.innerHTML = this.viewLogin(); this.bindLoginEvents(); return; }
    app.innerHTML = this.viewMain(); this.bindMainEvents();
  },
  viewLoading() {
    return `<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-50 to-slate-100"><div class="text-center"><div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-200"><svg class="w-9 h-9 text-white animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></div><p class="text-slate-400 text-sm font-medium">Loading Haskay…</p></div></div>`;
  },
  viewConnectionError() {
    return `<div class="min-h-screen flex items-center justify-center px-4 bg-slate-900"><div class="text-center max-w-md"><div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-rose-500/20 flex items-center justify-center"><svg class="w-9 h-9 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div><h1 class="text-xl font-bold text-white mb-2">Connection Error</h1><p class="text-slate-400 text-sm mb-1">Cannot connect to the Haskay cloud database.</p><p class="text-slate-500 text-xs mb-6">${this.state.connectionError}</p><button onclick="location.reload()" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold transition-all">Retry Connection</button></div></div>`;
  },
  viewLogin() {
    return `<div class="min-h-screen flex items-center justify-center px-4 py-8 bg-gradient-to-br from-brand-600 via-brand-700 to-slate-900"><div class="absolute inset-0 overflow-hidden opacity-10"><div class="absolute top-0 left-0 w-96 h-96 bg-brand-400 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div><div class="absolute bottom-0 right-0 w-96 h-96 bg-teal-300 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div></div><div class="relative w-full max-w-md scale-in"><div class="text-center mb-8"><div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center"><svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></div><h1 class="text-2xl font-bold text-white">Haskay Pharmacy & Labs</h1><p class="text-brand-200 text-sm mt-1">Management System</p></div><div class="bg-white rounded-3xl shadow-2xl p-8"><div class="flex gap-2 mb-6 p-1 bg-slate-100 rounded-xl"><button id="tab-login" class="flex-1 py-2.5 rounded-lg text-sm font-semibold bg-white text-slate-800 shadow-sm transition-all">Sign In</button><button id="tab-register" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-slate-500 transition-all">Register</button></div><div class="mb-4 px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-emerald-50 text-emerald-700"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Connected to cloud</div><form id="login-form" class="space-y-4"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email Address</label><div class="relative"><svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><input type="email" id="login-email" required class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-sm outline-none" placeholder="you@haskay.com"></div></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label><div class="relative"><svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg><input type="password" id="login-password" required class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-sm outline-none" placeholder="••••••••"></div></div><button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-700 hover:to-brand-800 text-white py-3.5 font-semibold rounded-xl transition-all shadow-lg shadow-brand-200 text-sm flex items-center justify-center gap-2"><span>Sign In</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg></button></form><form id="register-form" class="space-y-4 hidden"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Full Name</label><input type="text" id="register-name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-sm outline-none" placeholder="Your full name"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email Address</label><input type="email" id="register-email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-sm outline-none" placeholder="you@haskay.com"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label><input type="password" id="register-password" required minlength="6" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-sm outline-none" placeholder="Minimum 6 characters"></div><button type="submit" class="w-full bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-700 hover:to-brand-800 text-white py-3.5 font-semibold rounded-xl transition-all shadow-lg shadow-brand-200 text-sm">Create Account</button></form><p class="text-center text-xs text-slate-400 mt-5">Secure cloud authentication powered by Supabase</p></div><p class="text-center text-xs text-brand-200/60 mt-6">© 2026 Haskay and Labs. All rights reserved.</p></div></div>`;
  },
  bindLoginEvents() {
    const tL=document.getElementById('tab-login'),tR=document.getElementById('tab-register'),lF=document.getElementById('login-form'),rF=document.getElementById('register-form');
    tL?.addEventListener('click',()=>{tL.classList.add('bg-white','text-slate-800','shadow-sm');tL.classList.remove('text-slate-500');tR.classList.remove('bg-white','text-slate-800','shadow-sm');tR.classList.add('text-slate-500');lF.classList.remove('hidden');rF.classList.add('hidden');});
    tR?.addEventListener('click',()=>{tR.classList.add('bg-white','text-slate-800','shadow-sm');tR.classList.remove('text-slate-500');tL.classList.remove('bg-white','text-slate-800','shadow-sm');tL.classList.add('text-slate-500');rF.classList.remove('hidden');lF.classList.add('hidden');});
    lF?.addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('login-email').value,password=document.getElementById('login-password').value;const btn=lF.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="animate-pulse">Signing in…</span>';const{user,error}=await SupabaseManager.signIn(email,password);if(error){this.toast(error.message||'Login failed','error');btn.disabled=false;btn.innerHTML='<span>Sign In</span>';return;}this.state.user=user;await this.loadAllData();window.location.hash='/dashboard';this.render();this.toast('Welcome back!','success');});
    rF?.addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('register-email').value,password=document.getElementById('register-password').value,name=document.getElementById('register-name').value;const btn=rF.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="animate-pulse">Creating…</span>';const{user,error}=await SupabaseManager.signUp(email,password,name);if(error){this.toast(error.message||'Registration failed','error');btn.disabled=false;btn.innerHTML='Create Account';return;}this.state.user=user;window.location.hash='/dashboard';this.render();this.toast('Account created!','success');});
  },
  viewMain() {
    return `<div class="flex min-h-screen">${this.componentSidebar()}<div class="flex-1 flex flex-col min-w-0">${this.componentTopBar()}<main class="flex-1 overflow-y-auto bg-slate-50 p-4 md:p-8 pb-20 lg:pb-8" id="main-content"><div class="max-w-7xl mx-auto slide-up">${this.getRouteView()}</div></main>${this.componentMobileNav()}</div></div>`;
  },
  componentSidebar() {
    const items=[{hash:'/dashboard',label:'Dashboard',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'},{hash:'/patients',label:'Patients',icon:'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z'},{hash:'/documents',label:'Documents',icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'},{hash:'/expenses',label:'Expenses',icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}];
    const u=this.state.user||{};const name=u.user_metadata?.name||u.email?.split('@')[0]||'User';const init=(name[0]||'U').toUpperCase();
    return `<aside id="sidebar" class="fixed lg:sticky top-0 left-0 h-screen w-64 bg-white border-r border-slate-200 flex-col z-40 transform ${this.state.sidebarOpen?'translate-x-0':'-translate-x-full'} lg:translate-x-0 transition-transform duration-300 flex"><div class="p-5 border-b border-slate-100"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md shadow-brand-200"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></div><div><h1 class="text-base font-bold text-slate-800 leading-tight">Haskay</h1><p class="text-xs text-slate-400">Pharmacy & Labs</p></div></div></div><nav class="flex-1 p-3 space-y-1 overflow-y-auto" role="navigation" aria-label="Main navigation">${items.map(i=>`<a href="#${i.hash}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-all ${this.state.route===i.hash?'active':''}" aria-current="${this.state.route===i.hash?'page':'false'}"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${i.icon}"/></svg><span>${i.label}</span></a>`).join('')}</nav><div class="p-3 border-t border-slate-100"><div class="flex items-center gap-3 px-3 py-2 mb-2"><div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white font-semibold text-sm">${init}</div><div class="min-w-0"><p class="text-sm font-semibold text-slate-700 truncate">${name}</p><p class="text-xs text-slate-400 truncate">${u.email||''}</p></div></div><div class="flex items-center gap-2 mb-2 px-3"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-xs text-slate-400">Cloud connected</span></div><button id="logout-btn" class="w-full flex items-center justify-center gap-2 text-sm font-medium text-rose-600 hover:bg-rose-50 py-2.5 rounded-xl transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</button></div></aside>${this.state.sidebarOpen?'<div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 lg:hidden"></div>':''}`;
  },
  componentTopBar() {
    const titles={'/dashboard':'Dashboard','/patients':'Patient Registry','/documents':'Patient Documents','/expenses':'Expense Tracker'};
    const title=titles[this.state.route]||'Haskay';
    return `<header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 md:px-8 py-3.5 flex items-center justify-between"><div class="flex items-center gap-3"><button id="menu-toggle" class="lg:hidden p-2 rounded-lg hover:bg-slate-100" aria-label="Toggle menu"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button><div><h2 class="text-lg font-bold text-slate-800">${title}</h2><p class="text-xs text-slate-400 hidden sm:block">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div></div><div class="flex items-center gap-2"><div class="relative hidden sm:block"><svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><input type="text" id="global-search" placeholder="Search…" class="w-48 md:w-64 pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div></div></header>`;

text-sm text-slate-400">Track your pharmacy overhead costs here</p></div>`:`<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden"><div class="divide-y divide-slate-50">${ex.map(e=>`<div class="flex items-center justify-between p-4 hover:bg-slate-50 transition-colors"><div class="flex items-center gap-3 min-w-0 flex-1"><div class="w-10 h-10 rounded-xl ${e.category==='Water'?'bg-blue-50 text-blue-600':e.category==='Overhead'?'bg-amber-50 text-amber-600':'bg-slate-100 text-slate-600'} flex items-center justify-center flex-shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8"/></svg></div><div class="min-w-0"><p class="text-sm font-semibold text-slate-700">${e.category||'General'}</p><p class="text-xs text-slate-400 truncate">${e.description||''} • ${e.date||e.created_at?.split('T')[0]||''}</p></div></div><div class="flex items-center gap-3 flex-shrink-0"><p class="text-sm font-bold text-slate-800">GHS ${(parseFloat(e.amount)||0).toFixed(2)}</p><button class="delete-expense-btn p-1.5 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-600 transition-all" data-id="${e.id}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div>`).join('')}</div></div>`}</div>`;
  },
  openModal(content){
    document.getElementById('modal-root').innerHTML=`<div class="fixed inset-0 bg-black/40 backdrop-blur-sm fade-in flex items-center justify-center p-4 z-50" id="modal-overlay"><div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto scale-in" id="modal-content">${content}</div></div>`;
    document.getElementById('modal-overlay')?.addEventListener('click',(e)=>{if(e.target.id==='modal-overlay')this.closeModal();});
  },
  closeModal(){document.getElementById('modal-root').innerHTML='';},
  modalPatient(p){
    p=p||{};const title=p.id?'Edit Patient':'Add New Patient';
    return `<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="text-lg font-bold text-slate-800">${title}</h3><button id="modal-close" class="p-2 rounded-lg hover:bg-slate-100 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><form id="patient-form" class="space-y-4"><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Full Name *</label><input type="text" name="full_name" required value="${p.full_name||p.name||''}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Patient ID</label><input type="text" name="patient_id" value="${p.patient_id||'HP-'+Math.random().toString(36).substr(2,6).toUpperCase()}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Date of Birth</label><input type="date" name="date_of_birth" value="${p.date_of_birth||p.dob||''}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Gender</label><select name="gender" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"><option value="">Select…</option><option value="Male" ${p.gender==='Male'?'selected':''}>Male</option><option value="Female" ${p.gender==='Female'?'selected':''}>Female</option><option value="Other" ${p.gender==='Other'?'selected':''}>Other</option></select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Phone</label><input type="tel" name="phone" value="${p.phone||''}" placeholder="0244XXXXXX" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email</label><input type="email" name="email" value="${p.email||''}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Address</label><input type="text" name="address" value="${p.address||''}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Blood Type</label><select name="blood_type" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"><option value="">Unknown</option>${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(bt=>`<option value="${bt}" ${p.blood_type===bt?'selected':''}>${bt}</option>`).join('')}</select></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Status</label><select name="status" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"><option value="Active" ${p.status==='Active'||!p.status?'selected':''}>Active</option><option value="Inactive" ${p.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Allergies</label><input type="text" name="allergies" value="${p.allergies||''}" placeholder="e.g. Penicillin, Sulfa drugs" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Clinical Notes</label><textarea name="notes" rows="3" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all resize-none">${p.notes||''}</textarea></div><div class="flex gap-3 pt-2"><button type="button" id="modal-cancel" class="flex-1 py-2.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-all">Cancel</button><button type="submit" class="flex-1 py-2.5 bg-gradient-to-r from-brand-600 to-brand-700 text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-brand-200 transition-all">${p.id?'Save Changes':'Add Patient'}</button></div></form></div>`;
  },
  modalExpense(e){
    e=e||{};const title=e.id?'Edit Expense':'Add Expense';
    return `<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="text-lg font-bold text-slate-800">${title}</h3><button id="modal-close" class="p-2 rounded-lg hover:bg-slate-100 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><form id="expense-form" class="space-y-4"><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Category *</label><select name="category" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"><option value="">Select category…</option>${['Water','Electricity','Internet','Rent','Supplies','Transport','Salary','Maintenance','Other'].map(c=>`<option value="${c}" ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Amount (GHS) *</label><input type="number" name="amount" required step="0.01" min="0" value="${e.amount||''}" placeholder="0.00" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Date</label><input type="date" name="date" value="${e.date||new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"></div><div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Description</label><textarea name="description" rows="2" placeholder="Optional notes…" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all resize-none">${e.description||''}</textarea></div><div class="flex gap-3 pt-2"><button type="button" id="modal-cancel" class="flex-1 py-2.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-all">Cancel</button><button type="submit" class="flex-1 py-2.5 bg-gradient-to-r from-brand-600 to-brand-700 text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-brand-200 transition-all">${e.id?'Save':'Add Expense'}</button></div></form></div>`;
  },
  modalPatientDetail(p){
    return `<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="text-lg font-bold text-slate-800">Patient Details</h3><button id="modal-close" class="p-2 rounded-lg hover:bg-slate-100 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div><div class="flex items-center gap-4 mb-6 pb-6 border-b border-slate-100"><div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white font-bold text-2xl">${(p.full_name||p.name||'?')[0].toUpperCase()}</div><div><h4 class="text-xl font-bold text-slate-800">${p.full_name||p.name}</h4><p class="text-sm text-slate-400">ID: ${p.patient_id||'—'}</p><span class="inline-block mt-1 px-2.5 py-1 rounded-full text-xs font-semibold ${p.status==='Active'||!p.status?'bg-emerald-50 text-emerald-600':'bg-slate-100 text-slate-500'}">${p.status||'Active'}</span></div></div><div class="space-y-3">${p.date_of_birth||p.dob?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Date of Birth</span><span class="text-sm font-medium text-slate-700">${p.date_of_birth||p.dob}</span></div>`:''}${p.gender?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Gender</span><span class="text-sm font-medium text-slate-700">${p.gender}</span></div>`:''}${p.phone?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Phone</span><span class="text-sm font-medium text-slate-700">${p.phone}</span></div>`:''}${p.email?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Email</span><span class="text-sm font-medium text-slate-700">${p.email}</span></div>`:''}${p.address?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Address</span><span class="text-sm font-medium text-slate-700">${p.address}</span></div>`:''}${p.blood_type?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Blood Type</span><span class="text-sm font-bold text-rose-600">${p.blood_type}</span></div>`:''}${p.allergies?`<div class="flex justify-between py-2 border-b border-slate-50"><span class="text-sm text-slate-400">Allergies</span><span class="text-sm font-medium text-amber-600">⚠ ${p.allergies}</span></div>`:''}${p.notes?`<div class="py-2"><span class="text-sm text-slate-400 block mb-1">Clinical Notes</span><p class="text-sm text-slate-700 bg-slate-50 p-3 rounded-xl">${p.notes}</p></div>`:''}</div><button id="modal-close-2" class="w-full mt-6 py-2.5 bg-slate-100 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-200 transition-all">Close</button></div>`;
  },
  bindMainEvents(){
    document.getElementById('menu-toggle')?.addEventListener('click',()=>{this.state.sidebarOpen=!this.state.sidebarOpen;this.render();});
    document.getElementById('sidebar-overlay')?.addEventListener('click',()=>{this.state.sidebarOpen=false;this.render();});
    document.getElementById('logout-btn')?.addEventListener('click',async()=>{await SupabaseManager.signOut();this.state.user=null;window.location.hash='/login';this.render();this.toast('Signed out','success');});
    document.getElementById('global-search')?.addEventListener('input',(e)=>{this.state.searchQuery=e.target.value;if(this.state.route==='/patients')this.render();});
    document.getElementById('add-patient-btn')?.addEventListener('click',()=>this.openAddPatient());
    document.getElementById('add-patient-btn-2')?.addEventListener('click',()=>this.openAddPatient());
    document.getElementById('add-expense-btn')?.addEventListener('click',()=>this.openAddExpense());
    document.getElementById('add-doc-btn')?.addEventListener('click',()=>this.toast('Document upload coming soon','info'));
    document.querySelectorAll('.view-patient-btn').forEach(btn=>btn.addEventListener('click',()=>{const p=this.state.patients.find(x=>x.id===btn.dataset.id);if(p){this.openModal(this.modalPatientDetail(p));document.getElementById('modal-close')?.addEventListener('click',()=>this.closeModal());document.getElementById('modal-close-2')?.addEventListener('click',()=>this.closeModal());}}));
    document.querySelectorAll('.edit-patient-btn').forEach(btn=>btn.addEventListener('click',()=>{const p=this.state.patients.find(x=>x.id===btn.dataset.id);if(p)this.openEditPatient(p);}));
    document.querySelectorAll('.delete-patient-btn').forEach(btn=>btn.addEventListener('click',async()=>{if(confirm('Delete this patient?')){try{await SupabaseManager.delete('patients',btn.dataset.id);this.state.patients=await SupabaseManager.fetch('patients');this.render();this.toast('Patient deleted','success');}catch(e){this.toast(e.message,'error');}}}));
    document.querySelectorAll('.delete-expense-btn').forEach(btn=>btn.addEventListener('click',async()=>{if(confirm('Delete this expense?')){try{await SupabaseManager.delete('expenses',btn.dataset.id);this.state.expenses=await SupabaseManager.fetch('expenses');this.render();this.toast('Expense deleted','success');}catch(e){this.toast(e.message,'error');}}}));
    document.querySelectorAll('.delete-doc-btn').forEach(btn=>btn.addEventListener('click',async()=>{if(confirm('Delete this document?')){try{await SupabaseManager.delete('patient_documents',btn.dataset.id);this.state.documents=await SupabaseManager.fetch('patient_documents');this.render();this.toast('Document deleted','success');}catch(e){this.toast(e.message,'error');}}}));
  },
  openAddPatient(){this.openModal(this.modalPatient());this.bindPatientForm(null);},
  openEditPatient(p){this.openModal(this.modalPatient(p));this.bindPatientForm(p);},
  bindPatientForm(patient){
    document.getElementById('modal-close')?.addEventListener('click',()=>this.closeModal());
    document.getElementById('modal-cancel')?.addEventListener('click',()=>this.closeModal());
    document.getElementById('patient-form')?.addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(!data.status)data.status='Active';const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="animate-pulse">Saving…</span>';try{if(patient){await SupabaseManager.update('patients',patient.id,data);this.toast('Patient updated','success');}else{await SupabaseManager.insert('patients',data);this.toast('Patient added','success');}this.state.patients=await SupabaseManager.fetch('patients');this.closeModal();this.render();}catch(err){this.toast(err.message,'error');btn.disabled=false;btn.innerHTML=patient?'Save Changes':'Add Patient';}});
  },
  openAddExpense(){this.openModal(this.modalExpense());this.bindExpenseForm(null);},
  bindExpenseForm(expense){
    document.getElementById('modal-close')?.addEventListener('click',()=>this.closeModal());
    document.getElementById('modal-cancel')?.addEventListener('click',()=>this.closeModal());
    document.getElementById('expense-form')?.addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());data.amount=parseFloat(data.amount)||0;const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;btn.innerHTML='<span class="animate-pulse">Saving…</span>';try{if(expense){await SupabaseManager.update('expenses',expense.id,data);this.toast('Expense updated','success');}else{await SupabaseManager.insert('expenses',data);this.toast('Expense added','success');}this.state.expenses=await SupabaseManager.fetch('expenses');this.closeModal();this.render();}catch(err){this.toast(err.message,'error');btn.disabled=false;btn.innerHTML=expense?'Save':'Add Expense';}});
  },
  toast(message,type='info'){
    const colors={success:'bg-emerald-600',error:'bg-rose-600',info:'bg-slate-800'};
    const icons={success:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>',error:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>',info:'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'};
    const t=document.createElement('div');
    t.className=colors[type]+' text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 toast-in text-sm font-medium';
    t.innerHTML='<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">'+icons[type]+'</svg><span>'+message+'</span>';
    document.getElementById('toast-container').appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},3000);
  }
};
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
